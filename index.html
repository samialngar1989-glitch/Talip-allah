<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر طالب الله</title>
    <style>
        :root {
            --primary: #131921;
            --secondary: #232f3e;
            --accent: #febd69;
            --accent-hover: #f3a847;
            --bg: #eaeded;
            --text: #0f1111;
            --green: #007600;
            --red: #b12704;
        }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; text-align: right; }
        header { text-align: center; background: var(--primary); color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        header h1 { margin: 0 0 10px 0; color: var(--accent); }
        header p { color: #ccc; margin: 0; }
        .admin-toggle-btn { background: var(--green); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; margin-bottom: 15px; font-weight: bold; }
        .admin-panel { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .price-row { display: flex; gap: 10px; }
        .price-row input { flex: 2; }
        .price-row select { flex: 1; }
        .save-btn { background: var(--secondary); color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .categories-nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-btn { background: #fff; border: 1px solid #ccc; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .cat-btn.active { background: var(--secondary); color: white; border-color: var(--secondary); }
        
        /* Amazon Style Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .product-card { background: #fff; border-radius: 4px; border: 1px solid #d5d9d9; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.03); transition: 0.2s; }
        .product-card:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .product-images-container { display: flex; height: 160px; background: #f8f8f8; justify-content: center; align-items: center; margin-bottom: 10px; position: relative; border-radius: 4px; overflow: hidden; }
        .product-img { flex: 1; background-size: contain; background-repeat: no-repeat; background-position: center; height: 100%; }
        
        .product-body { flex-grow: 1; }
        .product-category-tag { background: #f0f2f2; color: #555; font-size: 11px; padding: 2px 6px; border-radius: 3px; display: inline-block; margin-bottom: 5px; border: 1px solid #d5d9d9; }
        .product-title { margin: 5px 0; font-size: 16px; color: var(--text); font-weight: bold; line-height: 1.3; }
        .product-desc { color: #565959; font-size: 13px; margin: 0 0 8px 0; }
        
        .product-meta { font-size: 12px; color: #555; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .product-date { font-size: 11px; color: #888; margin-bottom: 10px; }
        
        .price { font-weight: bold; color: var(--red); font-size: 18px; margin-bottom: 10px; display: block; }
        
        /* Buy & Payment Flow */
        .buy-flow-container { border-top: 1px solid #eee; padding-top: 10px; margin-top: auto; }
        .main-buy-btn { background: var(--accent); border: 1px solid #a88734; border-radius: 20px; width: 100%; padding: 8px; cursor: pointer; font-weight: bold; font-size: 14px; text-align: center; box-shadow: 0 2px 5px rgba(213,217,217,.5); }
        .main-buy-btn:hover { background: var(--accent-hover); }
        
        .payment-options { display: none; margin-top: 8px; gap: 5px; flex-direction: column; }
        .payment-options.active { display: flex; }
        .payment-btn { padding: 6px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; color: white; font-weight: bold; }
        .btn-karimi { background: #007bff; }
        .btn-qutibi { background: #e0a800; color: black; }
        
        .delete-btn { background: transparent; color: #c40000; border: none; font-size: 12px; cursor: pointer; margin-top: 8px; text-align: right; width: 100%; padding: 0; }
        .delete-btn:hover { text-decoration: underline; }

        footer { text-align: center; margin-top: 20px; color: #777; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <h1>متجر طالب الله</h1>
    <p>متجرك الشامل لكافة الاحتياجات والسلع... نسعى لرزقك، ونلبي طلبك.</p>
</header>

<div class="container">
    <button class="admin-toggle-btn" onclick="toggleAdminPanel()">➕ لوحة إضافة سلعة جديدة</button>

    <div class="admin-panel" id="adminPanel">
        <h3>إضافة سلعة جديدة للمتجر</h3>
        <div class="form-group">
            <label>اسم السلعة:</label>
            <input type="text" id="newTitle" placeholder="مثلاً: قاطع كهربائي، طقم سباكة...">
        </div>
        <div class="form-group">
            <label>القسم:</label>
            <select id="newCategory">
                <option value="كهرباء">كهرباء</option>
                <option value="سباكة">سباكة</option>
                <option value="ملابس">ملابس</option>
                <option value="أدوات منزلية">أدوات منزلية</option>
                <option value="سيارات">سيارات</option>
                <option value="أدوات مكتبية">أدوات مكتبية</option>
                <option value="أدوات بناء">أدوات بناء</option>
                <option value="كتب وثقافة">كتب وثقافة</option>
                <option value="أخرى عامة">أخرى عامة</option>
            </select>
        </div>
        <div class="form-group">
            <label>السعر والعملة:</label>
            <div class="price-row">
                <input type="text" id="newPrice" placeholder="مثلاً: 5000 أو 10">
                <select id="newCurrency">
                    <option value="ر.ي">ريال يمني (ر.ي)</option>
                    <option value="$">دولار أمريكي ($)</option>
                    <option value="ر.س">ريال سعودي (ر.س)</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>العدد (الكمية المتاحة):</label>
            <input type="number" id="newQuantity" value="1" min="1">
        </div>
        <div class="form-group">
            <label>بريد العميل / المُضيف:</label>
            <input type="email" id="newEmail" placeholder="example@gmail.com">
        </div>
        <div class="form-group">
            <label>الصورة الرئيسية الأولى:</label>
            <input type="file" id="newImg1" accept="image/*">
        </div>
        <div class="form-group">
            <label>الصورة الثانية الإضافية (اختياري):</label>
            <input type="file" id="newImg2" accept="image/*">
        </div>
        <div class="form-group">
            <label>وصف مختصر:</label>
            <textarea id="newDesc" rows="2" placeholder="وصف سريع للسلعة..."></textarea>
        </div>
        <button class="save-btn" onclick="addNewProduct()">حفظ وإضافة السلعة</button>
    </div>

    <div class="categories-nav" id="categoriesNav">
        <button class="cat-btn active" onclick="filterProducts('all')">الكل</button>
        <button class="cat-btn" onclick="filterProducts('كهرباء')">كهرباء</button>
        <button class="cat-btn" onclick="filterProducts('سباكة')">سباكة</button>
        <button class="cat-btn" onclick="filterProducts('ملابس')">ملابس</button>
        <button class="cat-btn" onclick="filterProducts('أدوات منزلية')">أدوات منزلية</button>
        <button class="cat-btn" onclick="filterProducts('سيارات')">سيارات</button>
        <button class="cat-btn" onclick="filterProducts('أدوات مكتبية')">أدوات مكتبية</button>
        <button class="cat-btn" onclick="filterProducts('أدوات بناء')">أدوات بناء</button>
        <button class="cat-btn" onclick="filterProducts('كتب وثقافة')">كتب وثقافة</button>
        <button class="cat-btn" onclick="filterProducts('أخرى عامة')">أخرى عامة</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
</div>

<footer>
    <p>جميع الحقوق محفوظة لمتجر طالب الله &copy; 2026</p>
</footer>

<script>
    const whatsappNumber = "967773704939"; 
    const scriptURL = "https://script.google.com/macros/s/AKfycbxrH3ZeAf0LZVWX_sbhWzBgPTDn68e4_yytxRuByFjeBbtDISIni2uivf-oeuuqr3PSkw/exec";

    const storeAccounts = {
        "الكريمي": "3120830626",
        "القطيبي": "467192423"
    };

    let products = [];

    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function fetchProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777; padding:20px;">جاري جلب السلع...</p>';
        
        fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                products = data.reverse(); 
                displayProducts('all');
            })
            .catch(err => {
                console.error('Error:', err);
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:red; padding:20px;">فشل في تحميل السلع.</p>';
            });
    }

    function addNewProduct() {
        const title = document.getElementById('newTitle').value.trim();
        const category = document.getElementById('newCategory').value;
        const priceVal = document.getElementById('newPrice').value.trim();
        const currency = document.getElementById('newCurrency').value;
        const desc = document.getElementById('newDesc').value.trim();
        const quantity = parseInt(document.getElementById('newQuantity').value.trim()) || 1;
        const email = document.getElementById('newEmail').value.trim() || "غير معروف";
        
        const file1 = document.getElementById('newImg1').files[0];
        const file2 = document.getElementById('newImg2').files[0];

        if(!title || !priceVal) {
            alert('الرجاء إدخال عنوان السلعة والسعر على الأقل!');
            return;
        }

        const fullPrice = `${priceVal} ${currency}`;

        const getImageData = (file) => {
            return new Promise((resolve) => {
                if (!file) { resolve(""); return; }
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        };

        Promise.all([getImageData(file1), getImageData(file2)]).then(([img1Data, img2Data]) => {
            const newProd = {
                title: title,
                category: category,
                price: fullPrice,
                description: desc || 'لا يوجد وصف إضافي',
                img1: img1Data,
                img2: img2Data,
                quantity: quantity,
                email: email
            };

            alert('جاري الحفظ...');

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newProd)
            })
            .then(() => {
                alert('تمت الإضافة بنجاح!');
                document.getElementById('adminPanel').style.display = 'none';
                setTimeout(fetchProducts, 2000);
            })
            .catch(error => alert('حدث خطأ أثناء الإرسال.'));
        });
    }

    function togglePaymentOptions(buttonElement) {
        const flowContainer = buttonElement.closest('.buy-flow-container');
        const options = flowContainer.querySelector('.payment-options');
        options.classList.toggle('active');
    }

    function processPurchase(title, price, paymentMethod, rowIndex, currentQty) {
        let accNum = storeAccounts[paymentMethod] || "";
        let msg = `السلام عليكم، أريد طلب وشراء سلعة: ${title}\nالسعر: ${price}\nطريقة الدفع: ${paymentMethod}\nرقم الحساب: ${accNum}`;
        let encoded = encodeURIComponent(msg);
        window.open(`https://wa.me/${whatsappNumber}?text=${encoded}`, '_blank');

        // تحديث الكمية أو الحذف تلقائياً
        let newQty = currentQty - 1;
        
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                action: newQty > 0 ? "updateQty" : "delete", 
                rowIndex: rowIndex,
                quantity: newQty 
            })
        })
        .then(() => {
            setTimeout(fetchProducts, 2000);
        });
    }

    function deleteProduct(rowIndex) {
        if (!confirm('هل أنت متأكد من حذف هذه السلعة؟')) return;
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "delete", rowIndex: rowIndex })
        })
        .then(() => {
            setTimeout(fetchProducts, 2000);
        });
    }

    function displayProducts(filteredCategory) {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        const filtered = filteredCategory === 'all' 
            ? products 
            : products.filter(p => p.category === filteredCategory);

        if(filtered.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777; padding:20px;">لا توجد سلع مضافة في هذا القسم حالياً.</p>';
            return;
        }

        filtered.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            let bg1 = product.img1 ? `background-image: url('${product.img1}');` : '';
            let bg2 = product.img2 ? `background-image: url('${product.img2}');` : '';
            let qty = parseInt(product.quantity) || 1;

            card.innerHTML = `
                <div>
                    <div class="product-images-container">
                        <div class="product-img" style="${bg1}"></div>
                        ${product.img2 ? `<div class="product-img" style="${bg2}"></div>` : ''}
                    </div>
                    <div class="product-body">
                        <span class="product-category-tag">${product.category || 'عام'}</span>
                        <h3 class="product-title">${product.title || ''}</h3>
                        <p class="product-desc">${product.description || ''}</p>
                    </div>
                    <div class="product-meta">
                        <span>📦 المتبقي: <strong>${qty}</strong> قطعية</span>
                        <span>📧 ${product.email || 'غير معروف'}</span>
                    </div>
                    <div class="product-date">📅 ${product.timestamp || ''}</div>
                    <span class="price">${product.price || ''}</span>
                </div>
                
                <div>
                    <div class="buy-flow-container">
                        <button class="main-buy-btn" onclick="togglePaymentOptions(this)">🛒 شراء المنتج</button>
                        <div class="payment-options">
                            <button class="payment-btn btn-karimi" onclick="processPurchase('${product.title}', '${product.price}', 'الكريمي', ${product.rowIndex}, ${qty})">الدفع عبر الكريمي</button>
                            <button class="payment-btn btn-qutibi" onclick="processPurchase('${product.title}', '${product.price}', 'القطيبي', ${product.rowIndex}, ${qty})">الدفع عبر القطيبي</button>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteProduct(${product.rowIndex})">إزالة السلعة</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterProducts(category) {
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.textContent.includes(category === 'all' ? 'الكل' : category)) {
                btn.classList.add('active');
            }
        });
        displayProducts(category);
    }

    window.onload = fetchProducts;
</script>
</body>
</html>
