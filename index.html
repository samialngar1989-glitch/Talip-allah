<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>متجر طالب الله</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
        }
        body {
            background: #f4f7fc;
            padding: 20px;
            direction: rtl;
        }

        /* ===== HEADER ===== */
        .main-header {
            background: linear-gradient(145deg, #0f1a2b, #1a2f44);
            color: #fff;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .main-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .main-header p {
            font-size: 1.1rem;
            opacity: 0.85;
            max-width: 650px;
            margin: 0 auto;
        }

        /* ===== ADMIN TOGGLE ===== */
        .admin-toggle-btn {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
            box-shadow: 0 6px 18px rgba(40,167,69,0.3);
        }
        .admin-toggle-btn:hover {
            background: #218838;
            transform: scale(1.01);
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel {
            background: #fff;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            display: none;
            margin-bottom: 25px;
        }
        .admin-panel h3 {
            font-size: 1.5rem;
            color: #1a2f44;
            margin-bottom: 18px;
            border-right: 5px solid #007bff;
            padding-right: 14px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.2s;
            background: #fafbfc;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0,123,255,0.12);
        }
        .price-row {
            display: flex;
            gap: 10px;
        }
        .price-row input { flex: 2; }
        .price-row select { flex: 1; }
        .save-btn {
            background: #007bff;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 18px rgba(0,123,255,0.25);
        }
        .save-btn:hover {
            background: #0069d9;
            transform: scale(1.01);
        }

        /* ===== CATEGORIES ===== */
        .categories-nav {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 0 16px 0;
            margin-bottom: 18px;
            scrollbar-width: thin;
        }
        .categories-nav::-webkit-scrollbar { height: 4px; }
        .categories-nav::-webkit-scrollbar-thumb { background: #c0cbd6; border-radius: 10px; }
        .cat-btn {
            background: #fff;
            border: 1px solid #dce2ea;
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2c3e50;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .cat-btn:hover { background: #eef2f7; }
        .cat-btn.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
            box-shadow: 0 4px 14px rgba(0,123,255,0.25);
        }

        /* ===== PRODUCT GRID ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        /* ===== PRODUCT CARD ===== */
        .product-card {
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            transition: 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.10);
        }
        .product-images-container {
            display: flex;
            height: 190px;
            background: #eef2f7;
            overflow: hidden;
        }
        .product-img {
            flex: 1;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a9aaa;
            font-size: 0.9rem;
            background-color: #e9edf2;
            border-left: 1px solid #fff;
        }
        .product-img:last-child { border-left: none; }
        .product-body {
            padding: 14px 16px 10px;
            flex-grow: 1;
        }
        .product-category-tag {
            background: #e9ecf1;
            color: #2c3e50;
            font-size: 0.7rem;
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .product-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f1a2b;
            margin: 2px 0 4px;
            line-height: 1.3;
        }
        .product-desc {
            color: #5e6f7e;
            font-size: 0.9rem;
            margin: 4px 0 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-footer {
            padding: 12px 16px;
            background: #f8fafd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #edf2f7;
            flex-wrap: wrap;
            gap: 6px;
        }
        .price {
            font-weight: 700;
            color: #1e7e34;
            font-size: 1.1rem;
        }
        .stock-badge {
            font-size: 0.75rem;
            background: #ffc107;
            color: #222;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 700;
        }
        .stock-badge.low { background: #fd7e14; color: #fff; }
        .stock-badge.empty { background: #dc3545; color: #fff; }
        .buy-actions {
            display: flex;
            gap: 6px;
        }
        .buy-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            transition: 0.2s;
        }
        .buy-btn:hover { opacity: 0.85; transform: scale(0.96); }
        .buy-btn.primary { background: #007bff; }
        .buy-btn.warning { background: #f39c12; color: #222; }
        .buy-btn.success { background: #28a745; }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            max-width: 660px;
            width: 100%;
            border-radius: 28px;
            padding: 30px 28px;
            position: relative;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            animation: modalFade 0.25s ease;
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-close {
            position: absolute;
            top: 14px;
            left: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #6b7b8a;
            background: none;
            border: none;
            transition: 0.2s;
        }
        .modal-close:hover { color: #000; transform: rotate(90deg); }
        .modal-imgs {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .modal-imgs img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 16px;
            background: #f4f6f9;
            flex: 1 1 45%;
        }
        .modal-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f1a2b;
            margin: 6px 0 4px;
        }
        .modal-category {
            display: inline-block;
            background: #e9ecf1;
            padding: 2px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .modal-desc {
            color: #3d4e5e;
            line-height: 1.8;
            margin: 10px 0 14px;
        }
        .modal-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e7e34;
        }
        .modal-stock {
            font-size: 0.9rem;
            color: #555;
            margin-right: 12px;
        }
        .modal-buy-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            border-top: 1px solid #e9edf2;
            padding-top: 16px;
        }
        .modal-buy-btn {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            min-width: 130px;
        }
        .modal-buy-btn:hover { background: #1e7e34; }

        /* ===== CHECKOUT ===== */
        .checkout-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .checkout-overlay.active { display: flex; }
        .checkout-box {
            background: #fff;
            max-width: 480px;
            width: 100%;
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            animation: modalFade 0.2s ease;
        }
        .checkout-box h2 {
            font-size: 1.6rem;
            margin-bottom: 18px;
            color: #0f1a2b;
        }
        .checkout-box label {
            font-weight: 700;
            display: block;
            margin: 12px 0 4px;
            color: #2c3e50;
        }
        .checkout-box input,
        .checkout-box select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            background: #fafbfc;
        }
        .checkout-box input:focus,
        .checkout-box select:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0,123,255,0.1);
        }
        .checkout-submit {
            background: #25d366;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .checkout-submit:hover { background: #1ebe5c; }
        .checkout-cancel {
            background: #e9ecf1;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            transition: 0.2s;
            color: #2c3e50;
        }
        .checkout-cancel:hover { background: #d5dce4; }

        /* ===== CART BUTTON ===== */
        .cart-badge {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 60px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0,123,255,0.3);
            cursor: pointer;
            z-index: 100;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-badge:hover { background: #0069d9; transform: scale(1.05); }
        .cart-count {
            background: #ffc107;
            color: #222;
            border-radius: 40px;
            padding: 0 12px;
            font-size: 0.9rem;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            margin-top: 40px;
            color: #7a8a9a;
            font-size: 0.9rem;
            border-top: 1px solid #dfe5ea;
            padding-top: 20px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .main-header h1 { font-size: 2rem; }
            .products-grid { grid-template-columns: 1fr; }
            .product-images-container { height: 150px; }
            .modal-box { padding: 20px; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="main-header">
    <h1>🛒 متجر طالب الله</h1>
    <p>متجرك الشامل لكافة الاحتياجات والسلع… نسعى لرزقك، ونلبي طلبك.</p>
</header>

<div class="container">

    <!-- ADMIN TOGGLE -->
    <button class="admin-toggle-btn" onclick="toggleAdminPanel()">➕ لوحة إضافة سلعة جديدة</button>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanel">
        <h3>➕ إضافة سلعة جديدة</h3>
        <div class="form-group">
            <label>اسم السلعة *</label>
            <input type="text" id="newTitle" placeholder="مثلاً: قاطع كهربائي 20 أمبير" />
        </div>
        <div class="form-group">
            <label>القسم *</label>
            <select id="newCategory">
                <option value="كهرباء">كهرباء</option>
                <option value="سباكة">سباكة</option>
                <option value="ملابس">ملابس</option>
                <option value="أدوات منزلية">أدوات منزلية</option>
                <option value="سيارات">سيارات</option>
                <option value="أدوات مكتبية">أدوات مكتبية</option>
                <option value="أدوات بناء">أدوات بناء</option>
                <option value="كتب وثقافة">كتب وثقافة</option>
                <option value="لوحات وديكور">لوحات وديكور</option>
                <option value="هواتف">هواتف</option>
                <option value="ملابس">ملابس</option>
                <option value="أخرى عامة">أخرى عامة</option>
            </select>
        </div>
        <div class="form-group">
            <label>السعر والعملة *</label>
            <div class="price-row">
                <input type="text" id="newPrice" placeholder="مثلاً: 5000" />
                <select id="newCurrency">
                    <option value="ر.ي">ريال يمني (ر.ي)</option>
                    <option value="$">دولار أمريكي ($)</option>
                    <option value="ر.س">ريال سعودي (ر.س)</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>الكمية المتاحة *</label>
            <input type="number" id="newStock" placeholder="مثلاً: 10" value="10" min="1" />
        </div>
        <div class="form-group">
            <label>رابط الصورة الأولى (مباشر)</label>
            <input type="url" id="newImgUrl1" placeholder="https://example.com/image1.jpg" />
        </div>
        <div class="form-group">
            <label>رابط الصورة الثانية (اختياري)</label>
            <input type="url" id="newImgUrl2" placeholder="https://example.com/image2.jpg" />
        </div>
        <div class="form-group">
            <label>وصف السلعة</label>
            <textarea id="newDesc" rows="2" placeholder="وصف تفصيلي للسلعة..."></textarea>
        </div>
        <button class="save-btn" onclick="addNewProduct()">💾 حفظ وإضافة السلعة</button>
    </div>

    <!-- CATEGORIES NAV -->
    <div class="categories-nav" id="categoriesNav">
        <button class="cat-btn active" data-cat="all">الكل</button>
        <button class="cat-btn" data-cat="كهرباء">كهرباء</button>
        <button class="cat-btn" data-cat="سباكة">سباكة</button>
        <button class="cat-btn" data-cat="ملابس">ملابس</button>
        <button class="cat-btn" data-cat="أدوات منزلية">أدوات منزلية</button>
        <button class="cat-btn" data-cat="سيارات">سيارات</button>
        <button class="cat-btn" data-cat="أدوات مكتبية">أدوات مكتبية</button>
        <button class="cat-btn" data-cat="أدوات بناء">أدوات بناء</button>
        <button class="cat-btn" data-cat="كتب وثقافة">كتب وثقافة</button>
        <button class="cat-btn" data-cat="لوحات وديكور">لوحات وديكور</button>
        <button class="cat-btn" data-cat="هواتف">هواتف</button>
        <button class="cat-btn" data-cat="أخرى عامة">أخرى عامة</button>
    </div>

    <!-- PRODUCTS GRID -->
    <div class="products-grid" id="productsGrid"></div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="productModal">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-imgs" id="modalImages"></div>
        <div class="modal-category" id="modalCategory"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <div>
            <span class="modal-price" id="modalPrice"></span>
            <span class="modal-stock" id="modalStock"></span>
        </div>
        <div class="modal-buy-row">
            <button class="modal-buy-btn" onclick="openCheckoutFromModal()">🛒 شراء المنتج</button>
        </div>
    </div>
</div>

<!-- CHECKOUT OVERLAY -->
<div class="checkout-overlay" id="checkoutOverlay">
    <div class="checkout-box">
        <h2>🧾 إتمام الشراء</h2>
        <label>نوع الحساب / البنك</label>
        <input type="text" id="checkoutAccountType" placeholder="مثلاً: بنك الكريمي" />

        <label>رقم الحساب أو الهاتف المحول منه</label>
        <input type="text" id="checkoutAccountNumber" placeholder="مثلاً: 712345678" />

        <label>طريقة الدفع (المحول إليه)</label>
        <select id="checkoutPaymentMethod">
            <option value="بنك الكريمي">بنك الكريمي</option>
            <option value="بنك القطيبي">بنك القطيبي</option>
        </select>

        <button class="checkout-submit" onclick="submitCheckout()">📤 إرسال الطلب عبر واتساب</button>
        <button class="checkout-cancel" onclick="closeCheckout()">إلغاء</button>
    </div>
</div>

<!-- CART BADGE -->
<button class="cart-badge" onclick="showCart()">
    🛒 سلة المشتريات <span class="cart-count" id="cartCount">0</span>
</button>

<footer>
    <p>جميع الحقوق محفوظة لمتجر طالب الله &copy; 2026</p>
</footer>

<script>
    // ===== CONFIG =====
    const WHATSAPP_NUMBER = "967773704939";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyraLAOf4Zrm6RRrsfj0VdRsLl4EO54Sujm8KywDgZTRMAaUXxr-REoqR8Ir-ZAIqTtw/exec";

    // ===== STATE =====
    let products = [];
    let currentCategory = 'all';
    let currentModalProduct = null;
    let cart = [];

    // ===== DOM REFS =====
    const grid = document.getElementById('productsGrid');
    const modal = document.getElementById('productModal');
    const modalImages = document.getElementById('modalImages');
    const modalCategory = document.getElementById('modalCategory');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalPrice = document.getElementById('modalPrice');
    const modalStock = document.getElementById('modalStock');
    const checkoutOverlay = document.getElementById('checkoutOverlay');
    const cartCount = document.getElementById('cartCount');

    // ===== TOGGLE ADMIN =====
    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    // ===== FETCH PRODUCTS =====
    function fetchProducts() {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#7a8a9a; padding:30px;">⏳ جاري تحميل السلع...</p>';
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                products = data.reverse().map(p => ({
                    ...p,
                    stock: p.stock !== undefined ? Number(p.stock) : 10
                }));
                renderProducts(currentCategory);
            })
            .catch(err => {
                console.error('Fetch error:', err);
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#dc3545; padding:30px;">❌ فشل في تحميل السلع.</p>';
            });
    }

    // ===== RENDER PRODUCTS =====
    function renderProducts(category) {
        currentCategory = category;
        const filtered = category === 'all'
            ? products
            : products.filter(p => p.category === category);

        if (filtered.length === 0) {
            grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#7a8a9a; padding:30px;">🚫 لا توجد سلع في هذا القسم.</p>';
            return;
        }

        grid.innerHTML = '';
        filtered.forEach((product, index) => {
            const card = document.createElement('div');
            card.className = 'product-card';

            const img1 = product.img1 || product.image1 || '';
            const img2 = product.img2 || product.image2 || '';
            const stock = Number(product.stock) || 0;
            let stockClass = 'stock-badge';
            let stockLabel = `🟢 متبقي: ${stock}`;
            if (stock === 0) { stockClass += ' empty'; stockLabel = '🔴 نفد المخزون'; }
            else if (stock <= 3) { stockClass += ' low'; stockLabel = `🟠 متبقي: ${stock}`; }

            card.innerHTML = `
                <div class="product-images-container">
                    <div class="product-img" style="background-image: url('${img1}');">${img1 ? '' : '📷'}</div>
                    <div class="product-img" style="background-image: url('${img2}');">${img2 ? '' : (img1 ? '📷' : '')}</div>
                </div>
                <div class="product-body">
                    <span class="product-category-tag">${product.category || 'عام'}</span>
                    <div class="product-title">${product.title || 'سلعة'}</div>
                    <div class="product-desc">${(product.description || '').slice(0, 70)}...</div>
                </div>
                <div class="product-footer">
                    <div>
                        <span class="price">${product.price || '0'}</span>
                        <span class="${stockClass}">${stockLabel}</span>
                    </div>
                    <div class="buy-actions">
                        <button class="buy-btn primary" onclick="event.stopPropagation(); openModal(${index})">👁️ معاينة</button>
                        <button class="buy-btn success" onclick="event.stopPropagation(); addToCart(${index})">➕ سلة</button>
                        <button class="buy-btn warning" onclick="event.stopPropagation(); openCheckout(${index})">🛒 شراء</button>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => openModal(index));
            grid.appendChild(card);
        });
    }

    // ===== FILTER =====
    function filterProducts(category) {
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === category);
        });
        renderProducts(category);
    }

    // ===== MODAL =====
    function openModal(index) {
        const product = products[index];
        if (!product) return;
        currentModalProduct = product;

        const img1 = product.img1 || product.image1 || '';
        const img2 = product.img2 || product.image2 || '';
        const stock = Number(product.stock) || 0;

        modalImages.innerHTML = `
            <img src="${img1}" alt="صورة 1" onerror="this.style.display='none'" />
            ${img2 ? `<img src="${img2}" alt="صورة 2" onerror="this.style.display='none'" />` : ''}
        `;
        modalCategory.textContent = product.category || 'عام';
        modalTitle.textContent = product.title || 'سلعة';
        modalDesc.textContent = product.description || 'لا يوجد وصف إضافي.';
        modalPrice.textContent = product.price || '0';
        modalStock.textContent = stock > 0 ? `🟢 متبقي: ${stock}` : '🔴 نفد المخزون';

        modal.classList.add('active');
    }

    function closeModal() {
        modal.classList.remove('active');
        currentModalProduct = null;
    }

    // ===== CART =====
    function addToCart(index) {
        const product = products[index];
        if (!product) return;
        if (Number(product.stock) <= 0) {
            alert('❌ عذراً، هذه السلعة نفدت من المخزون.');
            return;
        }
        cart.push(product);
        updateCartCount();
        alert(`✅ تم إضافة "${product.title}" إلى سلة المشتريات.`);
    }

    function updateCartCount() {
        cartCount.textContent = cart.length;
    }

    function showCart() {
        if (cart.length === 0) {
            alert('🛒 سلة المشتريات فارغة حالياً.');
            return;
        }
        let msg = '🛒 سلة المشتريات:\n\n';
        cart.forEach((item, i) => {
            msg += `${i+1}. ${item.title} - ${item.price}\n`;
        });
        msg += `\nالمجموع: ${cart.length} سلعة(سلع)`;
        alert(msg);
    }

    // ===== CHECKOUT =====
    function openCheckout(index) {
        const product = products[index];
        if (!product) return;
        if (Number(product.stock) <= 0) {
            alert('❌ عذراً، هذه السلعة نفدت من المخزون.');
            return;
        }
        currentModalProduct = product;
        openCheckoutOverlay();
    }

    function openCheckoutFromModal() {
        if (!currentModalProduct) return;
        if (Number(currentModalProduct.stock) <= 0) {
            alert('❌ عذراً، هذه السلعة نفدت من المخزون.');
            return;
        }
        openCheckoutOverlay();
    }

    function openCheckoutOverlay() {
        document.getElementById('checkoutAccountType').value = '';
        document.getElementById('checkoutAccountNumber').value = '';
        document.getElementById('checkoutPaymentMethod').value = 'بنك الكريمي';
        checkoutOverlay.classList.add('active');
    }

    function closeCheckout() {
        checkoutOverlay.classList.remove('active');
    }

    // ===== SUBMIT CHECKOUT =====
    function submitCheckout() {
        const product = currentModalProduct;
        if (!product) {
            alert('الرجاء اختيار منتج أولاً.');
            return;
        }

        const accountType = document.getElementById('checkoutAccountType').value.trim();
        const accountNumber = document.getElementById('checkoutAccountNumber').value.trim();
        const paymentMethod = document.getElementById('checkoutPaymentMethod').value;

        if (!accountType || !accountNumber) {
            alert('الرجاء إدخال نوع الحساب ورقم الحساب.');
            return;
        }

        // Decrement stock
        const newStock = Math.max(0, Number(product.stock) - 1);
        product.stock = newStock;

        const msg = `
السلام عليكم، أريد طلب سلعة:
📦 المنتج: ${product.title}
🏷️ القسم: ${product.category || 'عام'}
💰 السعر: ${product.price}
📊 الكمية المتبقية: ${newStock}

🧾 بيانات المشتري:
🏦 نوع الحساب: ${accountType}
🔢 رقم الحساب/الهاتف: ${accountNumber}
💳 طريقة الدفع: ${paymentMethod}

يرجى تأكيد الطلب.
        `.trim();

        const encoded = encodeURIComponent(msg);
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encoded}`, '_blank');

        // Auto-delete if stock = 0
        if (newStock === 0) {
            const idx = products.indexOf(product);
            if (idx > -1) products.splice(idx, 1);
            alert('🔴 تم حذف السلعة تلقائياً لأن الكمية أصبحت صفراً.');
        }

        renderProducts(currentCategory);
        closeCheckout();
        closeModal();
        updateCartCount();
    }

    // ===== ADD NEW PRODUCT =====
    function addNewProduct() {
        const title = document.getElementById('newTitle').value.trim();
        const category = document.getElementById('newCategory').value;
        const priceVal = document.getElementById('newPrice').value.trim();
        const currency = document.getElementById('newCurrency').value;
        const stock = parseInt(document.getElementById('newStock').value) || 10;
        const imgUrl1 = document.getElementById('newImgUrl1').value.trim();
        const imgUrl2 = document.getElementById('newImgUrl2').value.trim();
        const desc = document.getElementById('newDesc').value.trim();

        if (!title || !priceVal) {
            alert('الرجاء إدخال عنوان السلعة والسعر.');
            return;
        }

        const fullPrice = `${priceVal} ${currency}`;

        const newProduct = {
            title,
            category,
            price: fullPrice,
            stock,
            img1: imgUrl1,
            img2: imgUrl2,
            description: desc || 'لا يوجد وصف إضافي'
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newProduct)
        })
        .then(() => {
            alert('✅ تم حفظ السلعة في جوجل شيت بنجاح!');
            document.getElementById('newTitle').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newStock').value = '10';
            document.getElementById('newImgUrl1').value = '';
            document.getElementById('newImgUrl2').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('adminPanel').style.display = 'none';
            setTimeout(fetchProducts, 1500);
        })
        .catch(err => {
            console.error('Save error:', err);
            alert('❌ حدث خطأ أثناء حفظ السلعة.');
        });
    }

    // ===== CATEGORY CLICKS =====
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            filterProducts(btn.dataset.cat);
        });
    });

    // ===== CLOSE MODAL/CHECKOUT ON OVERLAY =====
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });
    checkoutOverlay.addEventListener('click', (e) => {
        if (e.target === checkoutOverlay) closeCheckout();
    });

    // ===== INIT =====
    window.onload = fetchProducts;
</script>
</body>
</html>
