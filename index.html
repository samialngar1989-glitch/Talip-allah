<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر طالب الله</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; text-align: right; }
        header { text-align: center; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        header h1 { margin: 0 0 10px 0; color: #333; }
        header p { color: #666; margin: 0; }
        .admin-toggle-btn { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; margin-bottom: 15px; }
        .admin-panel { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .price-row { display: flex; gap: 10px; }
        .price-row input { flex: 2; }
        .price-row select { flex: 1; }
        .save-btn { background: #007bff; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .categories-nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-btn { background: #fff; border: 1px solid #ccc; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: #007bff; color: white; border-color: #007bff; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .product-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        .product-images-container { display: flex; height: 150px; background: #e9ecef; }
        .product-img { flex: 1; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: #aaa; border-right: 1px solid #fff; }
        .product-body { padding: 12px; flex-grow: 1; }
        .product-category-tag { background: #e2e3e5; color: #383d41; font-size: 12px; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 5px; }
        .product-title { margin: 5px 0; font-size: 18px; color: #333; }
        .product-desc { color: #666; font-size: 14px; margin: 0; }
        .product-footer { padding: 12px; background: #f8f9fa; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; }
        .price { font-weight: bold; color: #28a745; font-size: 16px; }
        .buy-actions { display: flex; gap: 5px; }
        .buy-btn { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; color: #fff; }
        footer { text-align: center; margin-top: 20px; color: #777; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <h1>متجر طالب الله</h1>
    <p>متجرك الشامل لكافة الاحتياجات والسلع... نسعى لرزقك، ونلبي طلبك.</p>
</header>

<div class="container">
    <button class="admin-toggle-btn" onclick="toggleAdminPanel()">➕ لوحة إضافة سلعة جديدة</button>

    <div class="admin-panel" id="adminPanel">
        <h3>إضافة سلعة مع صورتين وخيارات العملات</h3>
        <div class="form-group">
            <label>اسم السلعة:</label>
            <input type="text" id="newTitle" placeholder="مثلاً: قاطع كهربائي، طقم سباكة...">
        </div>
        <div class="form-group">
            <label>القسم:</label>
            <select id="newCategory">
                <option value="كهرباء">كهرباء</option>
                <option value="سباكة">سباكة</option>
                <option value="أدوات منزلية">أدوات منزلية</option>
                <option value="سيارات">سيارات</option>
                <option value="أدوات مكتبية">أدوات مكتبية</option>
                <option value="أدوات بناء">أدوات بناء</option>
                <option value="كتب وثقافة">كتب وثقافة</option>
                <option value="أخرى عامة">أخرى عامة</option>
            </select>
        </div>
        <div class="form-group">
            <label>السعر والعملة:</label>
            <div class="price-row">
                <input type="text" id="newPrice" placeholder="مثلاً: 5000 أو 10">
                <select id="newCurrency">
                    <option value="ر.ي">ريال يمني (ر.ي)</option>
                    <option value="$">دولار أمريكي ($)</option>
                    <option value="ر.س">ريال سعودي (ر.س)</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>الصورة الرئيسية الأولى:</label>
            <input type="file" id="newImg1" accept="image/*">
        </div>
        <div class="form-group">
            <label>الصورة الثانية الإضافية (اختياري):</label>
            <input type="file" id="newImg2" accept="image/*">
        </div>
        <div class="form-group">
            <label>وصف مختصر:</label>
            <textarea id="newDesc" rows="2" placeholder="وصف سريع للسلعة..."></textarea>
        </div>
        <button class="save-btn" onclick="addNewProduct()">حفظ وإضافة السلعة للمتجر</button>
    </div>

    <div class="categories-nav" id="categoriesNav">
        <button class="cat-btn active" onclick="filterProducts('all')">الكل</button>
        <button class="cat-btn" onclick="filterProducts('كهرباء')">كهرباء</button>
        <button class="cat-btn" onclick="filterProducts('سباكة')">سباكة</button>
        <button class="cat-btn" onclick="filterProducts('أدوات منزلية')">أدوات منزلية</button>
        <button class="cat-btn" onclick="filterProducts('سيارات')">سيارات</button>
        <button class="cat-btn" onclick="filterProducts('أدوات مكتبية')">أدوات مكتبية</button>
        <button class="cat-btn" onclick="filterProducts('أدوات بناء')">أدوات بناء</button>
        <button class="cat-btn" onclick="filterProducts('كتب وثقافة')">كتب وثقافة</button>
        <button class="cat-btn" onclick="filterProducts('أخرى عامة')">أخرى عامة</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
</div>

<footer>
    <p>جميع الحقوق محفوظة لمتجر طالب الله &copy; 2026</p>
</footer>

<script>
    const whatsappNumber = "967773704939"; 
    const scriptURL = "https://script.google.com/macros/s/AKfycbzSdEH5aASwWc6VnSOB3BQ1UkPzEPUJCNlnleteloluOSYjzZ6LLK32V_rNVL8f5I7WGA/exec";

    const storeAccounts = {
        "الكريمي": "3120830626",
        "القطيبي": "467192423"
    };

    let products = [];

    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function fetchProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777; padding:20px;">جاري جلب السلع من قاعدة البيانات...</p>';
        
        fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                products = data.reverse(); 
                displayProducts('all');
            })
            .catch(err => {
                console.error('Error fetching data:', err);
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:red; padding:20px;">فشل في تحميل السلع من جوجل شيت.</p>';
            });
    }

    function addNewProduct() {
        const title = document.getElementById('newTitle').value.trim();
        const category = document.getElementById('newCategory').value;
        const priceVal = document.getElementById('newPrice').value.trim();
        const currency = document.getElementById('newCurrency').value;
        const desc = document.getElementById('newDesc').value.trim();
        
        const file1 = document.getElementById('newImg1').files[0];
        const file2 = document.getElementById('newImg2').files[0];

        if(!title || !priceVal) {
            alert('الرجاء إدخال عنوان السلعة والسعر على الأقل!');
            return;
        }

        const fullPrice = `${priceVal} ${currency}`;

        const getImageData = (file) => {
            return new Promise((resolve) => {
                if (!file) {
                    resolve("");
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        };

        Promise.all([getImageData(file1), getImageData(file2)]).then(([img1Data, img2Data]) => {
            const newProd = {
                title: title,
                category: category,
                price: fullPrice,
                description: desc || 'لا يوجد وصف إضافي',
                img1: img1Data,
                img2: img2Data
            };

            alert('جاري حفظ السلعة في جوجل شيت...');

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newProd)
            })
            .then(() => {
                alert('تمت إضافة وحفظ السلعة بنجاح في جوجل شيت!');
                document.getElementById('newTitle').value = '';
                document.getElementById('newPrice').value = '';
                document.getElementById('newDesc').value = '';
                document.getElementById('newImg1').value = '';
                document.getElementById('newImg2').value = '';
                document.getElementById('adminPanel').style.display = 'none';
                
                setTimeout(fetchProducts, 2000);
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('حدث خطأ أثناء الإرسال.');
            });
        });
    }

    function checkout(title, price, paymentMethod) {
        let accNum = storeAccounts[paymentMethod] || "";
        let msg = `السلام عليكم، أريد طلب سلعة: ${title}\nالسعر: ${price}\nطريقة الدفع: ${paymentMethod}\nرقم الحساب المحول إليه: ${accNum}\nالرجاء تأكيد الطلب.`;
        let encoded = encodeURIComponent(msg);
        window.open(`https://wa.me/${whatsappNumber}?text=${encoded}`, '_blank');
    }

    function displayProducts(filteredCategory) {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        const filtered = filteredCategory === 'all' 
            ? products 
            : products.filter(p => p.category === filteredCategory);

        if(filtered.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777; padding:20px;">لا توجد سلع مضافة في هذا القسم حالياً.</p>';
            return;
        }

        filtered.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            let bg1 = product.img1 ? `background-image: url('${product.img1}');` : '';
            let txt1 = product.img1 ? '' : 'صورة 1';
            let bg2 = product.img2 ? `background-image: url('${product.img2}');` : '';
            let txt2 = product.img2 ? '' : (product.img1 ? 'صورة 2' : '');

            card.innerHTML = `
                <div class="product-images-container">
                    <div class="product-img" style="${bg1}">${txt1}</div>
                    ${product.img2 ? `<div class="product-img" style="${bg2}">${txt2}</div>` : ''}
                </div>
                <div class="product-body">
                    <span class="product-category-tag">${product.category}</span>
                    <h3 class="product-title">${product.title}</h3>
                    <p class="product-desc">${product.description}</p>
                </div>
                <div class="product-footer">
                    <span class="price">${product.price}</span>
                    <div class="buy-actions">
                        <button class="buy-btn" style="background:#007bff;" onclick="checkout('${product.title}', '${product.price}', 'الكريمي')">الكريمي</button>
                        <button class="buy-btn" style="background:#ffc107; color:#000;" onclick="checkout('${product.title}', '${product.price}', 'القطيبي')">القطيبي</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterProducts(category) {
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.textContent.includes(category === 'all' ? 'الكل' : category)) {
                btn.classList.add('active');
            }
        });
        displayProducts(category);
    }

    window.onload = fetchProducts;
</script>
</body>
</html>
